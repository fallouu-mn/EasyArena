name: Deploy to VPS

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to LWS VPS
    runs-on: ubuntu-latest

    steps:
      - name: Connect to VPS and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            PROJECT_DIR="/root/EasyArena-master"
            REPO_URL="https://github.com/fallouu-mn/EasyArena.git"

            if [ ! -d "$PROJECT_DIR/.git" ]; then
              echo "Not a git repo. Backing up .env and cloning fresh..."
              cp "$PROJECT_DIR/api/.env" /tmp/api_env_backup 2>/dev/null || true
              rm -rf "$PROJECT_DIR"
              git clone "$REPO_URL" "$PROJECT_DIR"
              cp /tmp/api_env_backup "$PROJECT_DIR/api/.env" 2>/dev/null || true
            fi

            echo "Going to project directory..."
            cd "$PROJECT_DIR"

            echo "Pulling latest code from GitHub..."
            git fetch origin
            git reset --hard origin/main

            echo "Rebuilding and restarting containers..."
            docker compose build --no-cache
            docker compose up -d

            echo "Cleaning up old Docker images..."
            docker image prune -f

            echo "Deployment successful!"
